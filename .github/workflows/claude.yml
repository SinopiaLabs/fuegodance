# Revisión y ayuda de Claude en PRs e issues (Sinopia Labs).
# - Menciona @claude en un comentario de PR/issue para pedirle algo.
# - Pon la etiqueta "revision-claude" a un PR para una revisión completa (solo comenta: no aprueba ni bloquea).
# Usa la suscripción compartida (secreto CLAUDE_CODE_OAUTH_TOKEN, de `claude setup-token`): por eso no corre en
# cada PR, solo cuando se pide. Solo usuarios con permiso de escritura pueden dispararlo.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [labeled]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'revision-claude') ||
      (github.event_name != 'pull_request' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Etiqueta "revision-claude": revisión completa del PR (solo comenta).
      - name: Revisión del PR
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Revisa el PR #${{ github.event.pull_request.number }} de ${{ github.repository }}.
            Lee el diff con `gh pr diff ${{ github.event.pull_request.number }}` y el contexto necesario.
            Busca, de más a menos grave: errores de lógica, seguridad, permisos, migraciones o datos que se
            puedan perder y riesgos para producción (este sistema tiene usuarios reales).
            Deja comentarios en línea solo donde haya un problema concreto (archivo:línea, escenario que lo
            dispara y corrección), y al final un comentario de resumen en español con `gh pr comment`.
            No apruebes, no pidas cambios formales y no modifiques código. Si el cambio está bien, dilo en una línea.
          claude_args: >-
            --model sonnet
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Mención @claude en un comentario: responde a lo que se le pide.
      - name: Responder a @claude
        if: github.event_name != 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model sonnet
            --max-turns 25
